<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello EZDocker</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #312e81, #0e7490); color: #fff; }
    main { text-align: center; padding: 24px; }
    h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0 0 12px; }
    p { opacity: .85; font-size: 1.1rem; }
    .box { display: inline-block; font-size: 4rem; animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-12px) rotate(-6deg); } }
  </style>
</head>
<body>
  <main>
    <div class="box">📦</div>
    <h1>Hello EZDocker !</h1>
    <p>Ce site a été mis en ligne en un glisser-déposer.</p>
    <p><small>Modifiez index.html, zippez le dossier et redéposez-le pour mettre à jour.</small></p>
  </main>
</body>
</html>
